# Nginx site for https://api.example.com
# Install as: /etc/nginx/sites-available/api.example.com
# Enable:     sudo ln -s /etc/nginx/sites-available/api.example.com /etc/nginx/sites-enabled/
# Test:       sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates are managed by Certbot (Let's Encrypt).
# Replace api.example.com with your real API hostname.

upstream swust_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # Managed by Certbot — paths shown as placeholders until certbot runs.
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 8m;

    access_log /var/log/nginx/api.example.com.access.log;
    error_log  /var/log/nginx/api.example.com.error.log;

    # Django admin + WhiteNoise static files
    location /static/ {
        alias /var/www/swust-api/current/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Prefer S3 for user uploads. Keep this only if SERVE_MEDIA=true (not recommended).
    # location /media/ {
    #     alias /var/www/swust-api/shared/media/;
    # }

    location / {
        proxy_pass http://swust_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
