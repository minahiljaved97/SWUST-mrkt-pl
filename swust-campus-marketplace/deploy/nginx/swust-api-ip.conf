# Nginx HTTP site for IP-based backend testing (before domain/HTTPS).
# Install as: /etc/nginx/sites-available/swust-api
# Enable:     sudo ln -sf /etc/nginx/sites-available/swust-api /etc/nginx/sites-enabled/
#             sudo rm -f /etc/nginx/sites-enabled/default
# Test:       sudo nginx -t && sudo systemctl reload nginx

upstream swust_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3.26.65.149 _;

    client_max_body_size 8m;

    access_log /var/log/nginx/swust-api.access.log;
    error_log  /var/log/nginx/swust-api.error.log;

    location /static/ {
        alias /var/www/swust-api/current/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/swust-api/current/backend/media/;
    }

    location / {
        proxy_pass http://swust_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
